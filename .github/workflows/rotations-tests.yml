name: Rotation MVP regression
on:
  push:
    paths:
      - 'gradientdescentfarmers/model_builder/wofost_mvp/**'
      - 'gradientdescentfarmers/optimizer_builder/rotation_mvp/**'
      - 'gradientdescentfarmers/rotations_service/**'
      - 'tests/rotations/**'
      - 'resources/rotation_mvp.json'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'gradientdescentfarmers/model_builder/wofost_mvp/**'
      - 'gradientdescentfarmers/optimizer_builder/rotation_mvp/**'
      - 'gradientdescentfarmers/rotations_service/**'
      - 'tests/rotations/**'
      - 'pyproject.toml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[rotations,gcs,source-cloud,source-test]'
      - run: python -m pytest tests/rotations -q
