[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradientdescentfarmers"
dynamic = ["version"]
description = "Scaffolding for the GradientDescentFarmers Space Apps project"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "gradientdescentfarmers.version.__version__"}

[tool.setuptools.packages.find]
include = ["gradientdescentfarmers*"]

[project.optional-dependencies]
source = ["pydantic>=2.7,<3", "pandas>=2.1,<3", "numpy>=1.26,<3", "requests>=2.31,<3", "urllib3>=2,<3", "python-dotenv>=1,<2", "OWSLib>=0.31", "rasterio>=1.3", "pyproj>=3.6", "earthaccess>=0.10", "h5py>=3.10", "pyarrow>=15"]
source-test = ["pytest>=8", "httpx>=0.27,<1"]
source-modis = ["pyhdf>=0.11,<1"]
gcs = ["google-cloud-storage>=2.19,<4"]
source-cloud = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
rotations = ["pcse==6.0.13", "pydantic>=2.7,<3", "pandas>=2.1,<3", "numpy>=1.26,<2", "pyarrow==20.0.0", "shapely>=2,<3"]
