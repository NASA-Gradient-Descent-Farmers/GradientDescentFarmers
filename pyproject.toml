[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradientdescentfarmers"
dynamic = ["version"]
description = "Scaffolding for the GradientDescentFarmers Space Apps project"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "gradientdescentfarmers.version.__version__"}

[tool.setuptools.packages.find]
include = ["gradientdescentfarmers*"]
